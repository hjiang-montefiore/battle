name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  simulation:
    name: Simulation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download"
          FILE="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "$BASE/${GODOT_VERSION}-stable/${FILE}.zip"
          unzip -q godot.zip
          mv "$FILE" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # New scripts are not in the project's script-class cache until the
      # project is scanned, and class_name globals do not resolve without it.
      - name: Build the script class cache
        run: godot --path game --headless --import

      - name: Simulation core tests
        run: godot --path game --headless --script res://sim/tests/run_sim_tests.gd

  proving-ground:
    name: Proving ground boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download"
          FILE="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "$BASE/${GODOT_VERSION}-stable/${FILE}.zip"
          unzip -q godot.zip
          mv "$FILE" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import assets
        run: godot --path game --headless --import

      - name: Boot and check the self-test
        run: |
          set -euo pipefail
          godot --path game --headless --quit-after 120 2>&1 | tee boot.log

          # Every self-test counter must read N / N, and the input map must be
          # fully bound. The dead input map that shipped for a day looked
          # exactly like a working one until something asserted on it.
          if grep -q "INPUT MAP BROKEN" boot.log; then
            echo "::error::the input map has unbound actions"
            exit 1
          fi
          fail=0
          while read -r line; do
            got=$(sed -E 's/.* ([0-9]+) \/ ([0-9]+).*/\1/' <<<"$line")
            want=$(sed -E 's/.* ([0-9]+) \/ ([0-9]+).*/\2/' <<<"$line")
            if [ "$got" != "$want" ]; then
              echo "::error::self-test regression: $line"
              fail=1
            fi
          done < <(grep -E "\[selftest\].* [0-9]+ / [0-9]+" boot.log)
          if ! grep -q "units spawned" boot.log; then
            echo "::error::the proving ground did not run its self-test at all"
            exit 1
          fi
          exit $fail

  art-pipeline:
    name: Art pipeline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sockets, world-space dimensions per role, and the ground-plane rule,
      # across every blockout and every model the game actually loads.
      - name: Validate models
        run: python3 tools/validate_sockets.py

      - name: Tool scripts parse
        run: |
          set -euo pipefail
          for f in tools/*.py; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done
          echo "all tool scripts parse"

      # These paths made the pipeline unrunnable on any machine but the
      # author's, and leaked a home directory into a public repository.
      - name: No hardcoded absolute paths
        run: |
          if grep -rn "/Users/[a-z]" --include="*.py" --include="*.gd" \
               --include="*.godot" tools game 2>/dev/null; then
            echo "::error::hardcoded absolute path -- derive it from __file__ or res://"
            exit 1
          fi
          echo "no hardcoded absolute paths"
